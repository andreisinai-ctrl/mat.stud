    .kapitel-grid {

      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .kapitel-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #f1f2f6;
      color: #2f3640;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
    }

    .kapitel-btn:hover {
      background-color: #3498db;
      color: white;
      transform: translateY(-2px);
    }
  </style>
</head>
